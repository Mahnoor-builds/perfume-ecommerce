<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Scentsation</title>
    
    <!-- CSS Loading Order Fixed -->
    <link rel="stylesheet" href="homestyle.css">
    <link rel="stylesheet" href="cartstyle.css">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo"><img src="all-images/Untitled design (7)[1] (3).png" alt="Scentsation"></a>
            
            <nav class="nav-links">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="product.html">Shop</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>

            <div class="top-search">
                <div class="container">
                    <div class="input-group">
                        <span class="input-group-addon"><i class="fa fa-search"></i></span>
                        <input type="text" class="form-control" placeholder="Search">
                        <span class="input-group-addon close-search"><i class="fa fa-times"></i></span>
                    </div>
                </div>
            </div>

            <div class="icons">
                <div class="search-bar">
                    <button type="button" class="search-icon"><i class="fa fa-search"></i></button>
                </div>
                <a href="cart.html" class="cart">
                    <i class="fas fa-shopping-cart"></i>
                    <span id="cart-count">0</span>
                </a>
                
                <div class="user-container">
                    <a href="login.html" class="login"><i class="fas fa-user"></i></a>
                    <div class="login-container">
                        <form class="login-form">
                            <input type="text" placeholder="Username" class="input-field">
                            <input type="password" placeholder="Password" class="input-field">
                            <button type="submit" class="login-btn">Log In</button>
                            <div class="links">
                                <a href="contact.html" class="forgot">Forgot password?</a>
                                <a href="contact.html" class="signup">Sign up</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            
            <button id="menu-btn" class="menu-btn"><i class="fas fa-bars"></i></button>
        </div>
    
        <div id="mobile-menu" class="mobile-menu">
            <button id="close-menu" class="close-menu"><i class="fas fa-times"></i></button>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="product.html">Shop</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html" class="cart"><i class="fas fa-shopping-cart"></i> Cart</a></li>
                <li><a href="login.html" class="login"><i class="fas fa-user"></i> Login</a></li>
            </ul>    
        </div>
    </header>

    <div id="cart-wrapper">
        <h2 id="cart-text">Your Cart</h2>
    
        <div id="cart-container">
            <div id="cart-products"></div>
            <div id="total-container">
                <p id="total-price">Total: Rs 0</p>
            </div>
            <button id="clear-cart">Clear Cart</button>
            <button id="checkout-btn">Proceed to Checkout</button>
        </div>
    
        <div id="checkout-form">
            <h3>Enter Your Details</h3>
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <input type="text" id="address" placeholder="Your Address" required>
            <input type="tel" id="phone" placeholder="Your Phone Number" required>
            <button id="confirm-order">Confirm Order</button>
        </div>
    
        <div id="order-confirmation">
            <p>✅ Your order has been placed successfully!</p>
        </div>
    </div>

    <!-- The Missing Script has been added! -->
    <script src="home.js"></script>
    <script src="cartpage.js"></script>
</body>
</html>
